# ----------------------------------------------------------------
# Experiment configuration for zenapi_stream2omezarr.py
#
# This file defines the ZEN experiment and output settings for direct
# OME-ZARR streaming (no buffering in memory required).
# T/C/Z/M/S are read from the selected experiment XML at run time.
#
# Copy this file, adjust the values to match your ZEN experiment,
# and pass it via:
#   python zenapi_stream2omezarr.py --experiment-config my_experiment.ini
# ----------------------------------------------------------------

[experiment]
# ZEN experiment name (without .czexp extension)
name = ZEN_API_OMEZARR_Stream

# CZI output name when starting experiment from script (without .czi)
czi_name = zenapi_stream

# Start the experiment from the script (true) or from ZEN UI (false)
start_from_script = true

# Allow overwriting an existing CZI file
overwrite_czi = true

[dimensions]
# Optional fallback physical Z-step in microns for display-only mode.
# OME-ZARR mode uses the value from the selected experiment XML.
z_spacing = 1

# T/C/Z/M/S and frame height/width are read from ZEN automatically.

[output]
# Directory where the OME-ZARR will be created
# Use forward slashes or escaped backslashes
directory = F:\Zen_Output\streaming

# Compatibility fallback for legacy entry points. On-the-fly streaming uses
# the PixelType reported by the first runtime frame instead.
dtype = uint16

# Compression: blosc-zstd, blosc-lz4, zstd, none
compression = blosc-zstd

# Overwrite existing OME-ZARR at the output path
overwrite = true

# Keep individual generic tile groups after scene mosaics are assembled.
# false avoids storing the pixel data twice. HCS positions are unaffected.
keep_source_tiles = false

# Number of Y/X chunks per spatial shard. Set to 0 or leave empty to disable.
spatial_shard_size_chunks = 2

# Number of 2x Y/X pyramid levels generated after acquisition. 0 disables.
pyramid_levels = 0

[stream]
# Filter by channel index (leave empty for all channels)
channel_index =

# Maximum number of out-of-order frames buffered before aborting.
max_pending_frames = 4096

[zenapi]
# Path to ZEN-API gateway configuration file (config.ini)
# Leave empty to use the default config.ini next to the script
config = F:\GitHub\\napari-zenapi-streaming\config.ini
