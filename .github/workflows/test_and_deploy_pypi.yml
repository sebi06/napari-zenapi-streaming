name: test_and_deploy_pypi

on:
    push:
        branches: [master, npe2, use_zenapi_package]
        tags: ["v*"]
    pull_request:
        branches: [master, npe2, use_zenapi_package]
    workflow_dispatch:

jobs:
    test:
        name: ${{ matrix.platform }} py${{ matrix.python-version }}
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 30
        env:
            QT_QPA_PLATFORM: offscreen
            AIOCP_MAX_WORKERS: "1"
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Set up Qt libraries (Linux)
              if: runner.os == 'Linux'
              uses: tlambert03/setup-qt-libs@v1

            - name: Install Windows OpenGL
              if: runner.os == 'Windows'
              run: |
                  git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
                  powershell gl-ci-helpers/appveyor/install_opengl.ps1

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .[testing] build ruff

            - name: Install ZEN API wheel
              shell: bash
              env:
                  ZEN_API_WHEEL_URL: ${{ secrets.ZEN_API_WHEEL_URL }}
              run: |
                  if [[ -z "$ZEN_API_WHEEL_URL" ]]; then
                    echo "Configure the ZEN_API_WHEEL_URL secret with an authorized wheel URL."
                    exit 1
                  fi
                  python -m pip install "$ZEN_API_WHEEL_URL"

            - name: Check Python correctness
              run: python -m ruff check --select E4,E7,E9,F src/napari_zen_streaming

            - name: Run tests
              uses: aganders3/headless-gui@v2
              with:
                  run: python -m pytest -q src/napari_zen_streaming/_tests

            - name: Verify package builds
              run: python -m build --sdist --wheel --outdir dist/ci

    deploy:
        needs: [test]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install publish dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -U setuptools setuptools_scm wheel twine build

            - name: Build and publish to PyPI
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}
              run: |
                  python -m build .
                  twine check dist/*
                  twine upload dist/*
